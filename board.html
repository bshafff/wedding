<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1d21"><link rel="manifest" href="manifest.json">
<title>Wedding Board</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
button{cursor:pointer;touch-action:manipulation}
</style>
</head><body>
<header>
  <div class="hbtns">
    <button onclick="forcePull()" title="Tarik data dari Sheet">⬇️ Tarik</button>
    <button onclick="toast('Menyinkronkan...');syncBoard()">Sync</button>
    <button onclick="manualUpdate()">🔄</button>
  </div>
  <h1>Wedding Board</h1>
  <small>Inspirasi & konsep</small>
  <div><span id="cn" class="badge"></span></div>
</header>
<div id="st"></div>
<div id="bst" style="margin:8px 14px 0;padding:8px 12px;border-radius:8px;font:600 13px Figtree,sans-serif;display:none"></div>
<main id="m"></main>
<nav></nav>
<script src="app.js"></script>
<script>
renderNav('board');
const BK='sr_board';

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}

function loadBoardLocal(){
  try{
    const j=JSON.parse(localStorage[BK]||'null');
    if(!j||!Array.isArray(j.sections)) return {sections:[],del:{}};
    if(!j.del||typeof j.del!=='object') j.del={};
    return j;
  }catch(e){ return {sections:[],del:{}}; }
}

// ===== SYNC BOARD (merge di server, anti-timpa) =====
// Server menggabungkan data HP + laptop per item (id + waktu ubah), jadi tidak ada yang saling menimpa.
function apiUrl(){ return localStorage[K] || DEFAULT_URL; }
let boardVer=0, boardSyncing=null, boardErr='';
function setBoardStatus(){
  const e=document.getElementById('bst'); if(!e) return;
  const dirty=localStorage.sr_board_dirty==='1';
  if(boardErr){ e.style.background='#fde8e8'; e.style.color='#a33'; e.textContent='⚠️ '+boardErr; }
  else { e.style.background='#eef5ee'; e.style.color='#3d5f40';
    e.textContent=dirty?'⏳ Perubahan menunggu terkirim ke Sheet...':('✅ Tersinkron'+(localStorage.sr_board_last?' '+localStorage.sr_board_last:'')); }
}
function syncBoard(){
  if(boardSyncing) return boardSyncing;
  boardSyncing=(async()=>{
    try{
      for(let i=0;i<5;i++){
        if(!navigator.onLine){ boardErr='Offline, data tersimpan di perangkat ini'; break; }
        const ver=boardVer, local=loadBoardLocal();
        let j;
        try{
          const res=await fetch(apiUrl(),{method:'POST',headers:{'Content-Type':'text/plain'},body:JSON.stringify({action:'boardSave',data:local})});
          const txt=await res.text();
          try{ j=JSON.parse(txt); }catch(e){
            boardErr='Apps Script belum versi terbaru. Di editor: Deploy > Manage deployments > Edit > New version > Deploy.'; break;
          }
        }catch(e){ boardErr='Gagal terhubung ke Sheet, akan dicoba lagi'; break; }
        if(j.error){ boardErr='Server: '+j.error; break; }
        if(!j.ok||!j.data||!Array.isArray(j.data.sections)){ boardErr='Balasan server tidak dikenali'; break; }
        boardErr='';
        if(ver!==boardVer) continue;           // ada edit baru saat request jalan -> kirim ulang, jangan timpa
        localStorage[BK]=JSON.stringify(j.data);
        localStorage.sr_board_dirty='0';
        localStorage.sr_board_last=new Date().toLocaleTimeString('id-ID',{hour:'2-digit',minute:'2-digit'});
        break;
      }
    } finally { boardSyncing=null; setBoardStatus(); drawPage(); }
  })();
  return boardSyncing;
}

function initBoard(){
  if(!localStorage[K]) localStorage[K]=DEFAULT_URL;                 // pastikan perangkat ini tersambung
  const q=q_().filter(x=>x.action!=='boardSave'); if(q.length!==q_().length) setq(q); // buang antrean board versi lama
  drawPage(); syncBoard();
}
function forcePull(){ toast('Menyinkronkan...'); syncBoard(); }

function saveBoard(p){
  boardVer++;
  localStorage[BK]=JSON.stringify(p);
  localStorage.sr_board_dirty='1';
  drawPage(); setBoardStatus();
  syncBoard();
}

function formModal(title, fields, onSave){
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m) m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3>'+
    fields.map(f=>{
      if(f.type==='textarea') return '<label>'+esc(f.label)+'</label><textarea id="fm_'+f.key+'" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;min-height:80px">'+esc(f.value||'')+'</textarea>';
      if(f.type==='file') return '<label>'+esc(f.label)+'</label><input id="fm_'+f.key+'" type="file" accept="image/*" style="display:block;margin-bottom:10px">';
      return '<label>'+esc(f.label)+'</label><input id="fm_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.placeholder||'')+'">';
    }).join('')+
    '<div class="grid" style="margin-top:20px"><button data-act="form-cancel" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button data-act="form-save" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Simpan</button></div></div>';
  m._fields=fields; m._onSave=onSave; document.body.appendChild(m);
}
function confirmModal(title, message, onYes){
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m) m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3><p class="mute" style="margin:14px 0">'+esc(message)+'</p>'+
    '<div class="grid" style="margin-top:20px"><button data-act="cf-no" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button data-act="cf-yes" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Ya, lanjut</button></div></div>';
  m._onYes=onYes; document.body.appendChild(m);
}

async function compressImage(file){
  return new Promise((resolve,reject)=>{
    const reader=new FileReader();
    reader.onload=e=>{
      const img=new Image();
      img.onload=()=>{
        const canvas=document.createElement('canvas');
        const MAX=800;
        let w=img.width, h=img.height;
        if(w>MAX){ h=h*(MAX/w); w=MAX; }
        if(h>MAX){ w=w*(MAX/h); h=MAX; }
        canvas.width=w; canvas.height=h;
        canvas.getContext('2d').drawImage(img,0,0,w,h);
        resolve(canvas.toDataURL('image/jpeg',0.7));
      };
      img.src=e.target.result;
    };
    reader.onerror=reject;
    reader.readAsDataURL(file);
  });
}
async function uploadToDrive(dataUrl, filename){
  const u=localStorage[K];
  if(!u) throw new Error('Belum tersambung ke Google Sheet');
  const res=await fetch(u,{
    method:'POST', headers:{'Content-Type':'text/plain'},
    body:JSON.stringify({action:'uploadImage', base64:dataUrl, filename, mime:'image/jpeg'})
  });
  const j=await res.json();
  if(j.error) throw new Error(j.error);
  return j.url;
}

function addSection(){
  formModal('Tambah Kategori Board',[
    {key:'label', label:'Nama Kategori', value:'', placeholder:'Dekorasi, Seserahan, Venue, dll'}
  ], vals=>{
    if(!vals.label) return toast('Isi nama kategori');
    const p=loadBoardLocal();
    p.sections.push({id:uid(), label:vals.label, u:Date.now(), items:[]});
    saveBoard(p); toast('Kategori ditambahkan');
  });
}
function editSection(secId){
  const p=loadBoardLocal(); const s=p.sections.find(x=>x.id===secId); if(!s)return;
  formModal('Edit Kategori',[{key:'label', label:'Nama Kategori', value:s.label}],vals=>{
    if(!vals.label) return toast('Isi nama kategori');
    s.label=vals.label; s.u=Date.now(); saveBoard(p);
  });
}
function delSection(secId){
  confirmModal('Hapus Kategori?','Semua gambar di dalamnya akan dihapus dari daftar ini (file di Drive tetap aman).',()=>{
    const p=loadBoardLocal(); p.sections=p.sections.filter(x=>x.id!==secId); p.del[secId]=Date.now(); saveBoard(p); toast('Dihapus');
  });
}

async function openItemModal(secId, itemId){
  const p=loadBoardLocal(); const sec=p.sections.find(x=>x.id===secId); if(!sec)return;
  const isNew=!itemId;
  const it=isNew ? {title:'',note:'',img:'',tiktok:''} : (sec.items.find(x=>x.id===itemId)||{title:'',note:'',img:'',tiktok:''});
  
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m) m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+(isNew?'Tambah':'Edit')+' Inspirasi</h3>'+
    '<div class="sec">KATEGORI: '+esc(sec.label)+'</div>'+
    
    '<label>Link TikTok (Opsional)</label>'+
    '<div style="display:flex;gap:8px">'+
      '<input id="b_tk" type="url" value="'+esc(it.tiktok||'')+'" placeholder="https://vt.tiktok.com/..." style="flex:1">'+
      '<button id="b_fetch" type="button" style="padding:0 12px;border:1px solid var(--wine);background:none;color:var(--wine);border-radius:8px;font:600 13px Figtree,sans-serif">Ambil</button>'+
    '</div>'+

    '<label>Judul</label><input id="b_t" type="text" value="'+esc(it.title)+'" placeholder="Contoh: Bunga rustic">'+
    '<label>Catatan / Konsep</label><textarea id="b_n" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;min-height:80px" placeholder="Tulis ide, warna, alur, dll...">'+esc(it.note)+'</textarea>'+
    '<label>Ganti Foto (kosongkan jika tidak diubah)</label><input id="b_f" type="file" accept="image/*" style="display:block;margin-bottom:10px">'+
    (it.img?'<img src="'+esc(it.img)+'" style="width:100%;max-height:200px;object-fit:contain;background:#eee;border-radius:8px;margin-bottom:10px">':'')+
    '<div class="grid" style="margin-top:20px"><button id="b_cancel" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button id="b_save" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Simpan</button></div></div>';
  document.body.appendChild(m);

  document.getElementById('b_fetch').onclick = async () => {
    const tkUrl = document.getElementById('b_tk').value.trim();
    if(!tkUrl) return toast('Masukkan link TikTok dulu');
    const btn = document.getElementById('b_fetch'); btn.textContent='...';
    try {
      const res = await fetch('https://www.tiktok.com/oembed?url=' + encodeURIComponent(tkUrl));
      const data = await res.json();
      if(data.title) document.getElementById('b_t').value = data.title;
      toast('Info TikTok diambil');
    } catch(e) {
      toast('Gagal ambil info TikTok');
    }
    btn.textContent='Ambil';
  };

  document.getElementById('b_cancel').onclick=()=>m.remove();
  document.getElementById('b_save').onclick=async()=>{
    const title=document.getElementById('b_t').value.trim();
    const note=document.getElementById('b_n').value.trim();
    const tiktok=document.getElementById('b_tk').value.trim();
    const file=document.getElementById('b_f').files[0];
    if(!title) return toast('Isi judul');
    
    const btn=document.getElementById('b_save'); btn.textContent='Menyimpan...'; btn.disabled=true;

    try{
      let imgUrl=it.img;
      if(file){
        const dataUrl=await compressImage(file);
        imgUrl=await uploadToDrive(dataUrl, 'board_'+Date.now()+'.jpg');
      }
      const p2=loadBoardLocal();
      const sec2=p2.sections.find(x=>x.id===secId);
      if(!sec2){ toast('Kategori sudah dihapus'); m.remove(); return; }
      if(itemId){
        const it2=sec2.items.find(x=>x.id===itemId);
        if(it2){ it2.title=title; it2.note=note; it2.img=imgUrl; it2.tiktok=tiktok; it2.u=Date.now(); }
      } else {
        sec2.items.push({id:uid(), title, note, img:imgUrl, tiktok, u:Date.now()});
      }
      saveBoard(p2);
      m.remove(); toast('Tersimpan');
    }catch(err){
      toast('Gagal upload: '+err.message);
      btn.textContent='Simpan'; btn.disabled=false;
    }
  };
}

function delItem(secId,itemId){
  confirmModal('Hapus Inspirasi?','Item ini akan dihapus dari board.',()=>{
    const p=loadBoardLocal(); const sec=p.sections.find(x=>x.id===secId); if(!sec)return;
    sec.items=sec.items.filter(x=>x.id!==itemId); p.del[itemId]=Date.now(); saveBoard(p); toast('Dihapus');
  });
}

// ===== FITUR AI RUNDOWN =====
async function generateRundownAI() {
  if(!localStorage[K]) return toast('Sambungkan ke Google Sheet dulu');
  const p = loadBoardLocal();
  if(!p.sections.length) return toast('Board masih kosong, isi inspirasi dulu');

  let promptText = "Berikut adalah kumpulan inspirasi pernikahan kami dari berbagai video TikTok dan catatan pribadi:\n\n";
  p.sections.forEach(s => {
    promptText += `=== KATEGORI: ${s.label} ===\n`;
    s.items.forEach(it => {
      promptText += `- Referensi: ${it.title}\n`;
      promptText += `  Link: ${it.tiktok || 'Tidak ada link'}\n`;
      promptText += `  Konsep/Detail: ${it.note || 'Tidak ada catatan detail'}\n\n`;
    });
  });
  promptText += "\nTolong susun semua ide di atas menjadi satu ALUR ACARA (RUNDOWN) PERNIKAHAN yang utuh dan berurutan dari awal hingga akhir. Gabungkan ide-ide dari video TikTok yang berbeda menjadi satu kesatuan acara yang harmonis.";

  toast('AI sedang merangkai alur... (tunggu ± 10 detik)');
  
  try {
    const loadingModal = document.createElement('div'); loadingModal.id = 'md_loading';
    loadingModal.innerHTML = '<div style="position:fixed;inset:0;background:#0007;z-index:10000;display:flex;align-items:center;justify-content:center;color:#fff;font:600 16px Figtree,sans-serif">✨ AI sedang menyusun alur...</div>';
    document.body.appendChild(loadingModal);

    const res = await fetch(localStorage[K], {
      method: 'POST', headers: {'Content-Type': 'text/plain'},
      body: JSON.stringify({action: 'generateAI', prompt: promptText})
    });
    
    const txt = await res.text();
    let j;
    try {
      j = JSON.parse(txt);
    } catch (e) {
      throw new Error("Apps Script belum di-Deploy ulang (New Version) atau Error.");
    }

    loadingModal.remove();

    if(j.error) throw new Error(j.error);
    
    const m = document.createElement('div'); m.id = 'md';
    m.onclick = ev => { if(ev.target === m) m.remove(); };
    m.innerHTML = `<div class="mc"><h3>✨ Alur & Rundown AI</h3>
      <p class="mute" style="margin-bottom:12px">Dibuat berdasarkan gabungan semua video TikTok dan catatan di Board kamu.</p>
      <div style="white-space:pre-wrap;font-size:14px;line-height:1.6;background:#faf6f2;padding:14px;border-radius:8px;border:1px solid var(--line);max-height:60vh;overflow-y:auto">${esc(j.result)}</div>
      <button onclick="document.getElementById('md').remove()" style="width:100%;padding:14px;margin-top:16px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Tutup</button>
    </div>`;
    document.body.appendChild(m);
    
  } catch(err) {
    const lm = document.getElementById('md_loading');
    if(lm) lm.remove();
    toast('Gagal generate AI: ' + err.message);
  }
}

document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  if(act==='form-cancel'||act==='cf-no'){ const m=document.getElementById('md'); if(m) m.remove(); return; }
  if(act==='form-save'){
    const m=document.getElementById('md'); if(!m)return;
    const vals={};
    m._fields.forEach(f=>{ const el=document.getElementById('fm_'+f.key); vals[f.key]=el?el.value.trim():''; });
    m._onSave(vals); m.remove(); return;
  }
  if(act==='cf-yes'){
    const m=document.getElementById('md'); if(!m)return;
    const cb=m._onYes; m.remove(); if(cb) cb(); return;
  }
  const sec=b.dataset.sec, item=b.dataset.item;
  if(act==='sec-add') return addSection();
  if(act==='sec-edit') return editSection(sec);
  if(act==='sec-del') return delSection(sec);
  if(act==='item-add') return openItemModal(sec);
  if(act==='item-edit') return openItemModal(sec,item);
  if(act==='item-del') return delItem(sec,item);
});

window.sync=function(){ return syncBoard(); };

window.drawPage=function(){
  const p=loadBoardLocal();
  
  let html='<div style="display:flex;gap:8px;margin-bottom:16px">'+
  '<button data-act="sec-add" style="padding:11px;border-radius:10px;font:600 14px Figtree,sans-serif;flex:1;border:1px dashed var(--wine);background:none;color:var(--wine)">+ Tambah Kategori</button>'+
  '<button onclick="generateRundownAI()" style="padding:11px;border-radius:10px;font:600 14px Figtree,sans-serif;flex:1;border:0;background:var(--gold);color:#fff">✨ Buat Rundown AI</button>'+
  '</div>';
  
  if(!p.sections.length) html+='<p class="mute" style="text-align:center">Belum ada kategori. Tambah "Dekorasi", "Seserahan", dll.</p>';

  p.sections.forEach(s=>{
    html+='<div class="board-sec">';
    html+='<h3>'+esc(s.label)+'</h3>';
    html+='<div style="display:flex;gap:6px;margin-bottom:10px">';
    html+='<button data-act="sec-edit" data-sec="'+s.id+'" style="padding:4px 10px;border:1px solid var(--wine);background:none;color:var(--wine);border-radius:8px;font-size:12px">✏️ Kategori</button>';
    html+='<button data-act="sec-del" data-sec="'+s.id+'" style="padding:4px 10px;border:1px solid var(--line);background:none;color:#a33;border-radius:8px;font-size:12px">🗑️</button>';
    html+='</div>';
    
    html+='<div class="board-grid">';
    s.items.forEach(it=>{
      html+='<div class="board-card">'+
        (it.img?'<img class="img" src="'+esc(it.img)+'" loading="lazy">':'<div class="img empty">📷</div>')+
        '<div class="body">'+
          '<b>'+esc(it.title)+'</b>'+
          (it.note?'<small>'+esc(it.note)+'</small>':'')+
        '</div>'+
        '<button class="del-btn" data-act="item-del" data-sec="'+s.id+'" data-item="'+it.id+'">✕</button>'+
        '<div style="display:flex;border-top:1px solid var(--line)">'+
          '<button data-act="item-edit" data-sec="'+s.id+'" data-item="'+it.id+'" style="flex:1;padding:8px;border:0;background:none;font:600 12px Figtree,sans-serif;color:var(--wine)">Edit</button>'+
        '</div>'+
      '</div>';
    });
    html+='<div class="board-card" style="display:flex;align-items:center;justify-content:center;cursor:pointer;min-height:100px" data-act="item-add" data-sec="'+s.id+'"><div style="font-size:24px;color:#ccc">+</div></div>';
    html+='</div></div>';
  });
  
  html+='<div class="mute" style="text-align:center;margin-top:14px">Foto disimpan di Google Drive kamu.</div>';
  document.getElementById('m').innerHTML=html;
  const bs=document.getElementById('bst'); if(bs){ bs.style.display='block'; setBoardStatus(); }
};

initBoard();
window.addEventListener('online',()=>syncBoard());
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) syncBoard(); });
setInterval(()=>{ if(!document.hidden) syncBoard(); },30000);
</script>
</body></html>
