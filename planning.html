<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1d21"><link rel="manifest" href="manifest.json">
<title>Wedding Planning</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
button{cursor:pointer;touch-action:manipulation}
.plan-sec{background:#fff;border:1px solid var(--line);border-radius:12px;padding:12px;margin-bottom:12px}
.plan-sec h3{margin:0;font-family:Fraunces,Georgia,serif;color:var(--wine);font-size:17px}
.plan-task{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;background:#fff;border:1px solid var(--line);border-radius:10px;margin-bottom:6px}
.plan-task input[type=checkbox]{width:22px;height:22px;accent-color:var(--sage);margin-top:1px}
.plan-task .cat{font-size:11px;color:var(--gold);font-weight:600}
.plan-task .t{flex:1}
.plan-task.done .t>span:last-child{text-decoration:line-through;color:var(--mute)}
</style>
</head><body>
<header>
  <div class="hbtns">
    <button onclick="openInfo()">Edit Info</button>
    <button onclick="toast('Menyinkronkan...');sync()">Sync</button>
    <button onclick="manualUpdate()">🔄</button>
    <button onclick="askReset()">Reset</button>
  </div>
  <h1>Wedding Planning</h1>
  <div class="couple" id="couple">—</div>
  <small id="info"></small>
  <div><span id="cn" class="badge"></span></div>
</header>
<div id="st"></div>
<main id="m"></main>
<nav></nav>
<script src="app.js"></script>
<script>
renderNav('planning');

const PK='sr_plan';
const PLAN_DEFAULT={
  info:{couple:'Shaffan Burhan dan Annisa Istiqomah Sugandi', date:'2027-04-14', location:'Ciwidey'},
  sections:[
    {id:'s1', label:'H-12 bulan', tasks:[
      {id:'t1', cat:'Persiapan', title:'Diskusi & Perencanaan Awal', done:false},
      {id:'t2', cat:'Budgeting', title:'Menyusun anggaran pernikahan', done:false},
      {id:'t3', cat:'Budgeting', title:'Compare semua vendor', done:false}
    ]},
    {id:'s2', label:'H-10 bulan', tasks:[
      {id:'t4', cat:'Lamaran', title:'Persiapan acara lamaran', done:false},
      {id:'t5', cat:'Vendor', title:'Booking vendor', done:false}
    ]},
    {id:'s3', label:'H-8 bulan', tasks:[
      {id:'t6', cat:'Lamaran', title:'Acara lamaran', done:false},
      {id:'t7', cat:'Vendor', title:'List dan contact vendor', done:false},
      {id:'t8', cat:'Dokumen', title:'Mengurus dokumen pernikahan (KTP, KK, akta, dll)', done:false}
    ]},
    {id:'s4', label:'H-6 bulan', tasks:[
      {id:'t9', cat:'Vendor', title:'Menentukan pilihan vendor', done:false},
      {id:'t10', cat:'Undangan', title:'Desain & cetak undangan', done:false},
      {id:'t11', cat:'Entertainment', title:'Booking entertainment & souvenir', done:false},
      {id:'t12', cat:'Dokumentasi', title:'Booking foto/video', done:false},
      {id:'t13', cat:'Prewedding', title:'Prewedding, seserahan & MUA', done:false},
      {id:'t14', cat:'Fitting', title:'Fitting baju & food tasting', done:false},
      {id:'t15', cat:'Cincin', title:'Cincin', done:false},
      {id:'t16', cat:'Mahar', title:'Mahar', done:false},
      {id:'t17', cat:'Seserahan', title:'Seserahan', done:false},
      {id:'t18', cat:'Admin', title:'Administrasi', done:false},
      {id:'t19', cat:'Final', title:'Finalisasi & kirim undangan', done:false}
    ]},
    {id:'s5', label:'H-4 bulan', tasks:[
      {id:'t20', cat:'Diri', title:'Menyiapkan diri & kesehatan', done:false}
    ]},
    {id:'s6', label:'H-3 bulan', tasks:[
      {id:'t21', cat:'Diri', title:'Persiapan akhir & gladi resik', done:false}
    ]}
  ]
};
  
function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function normalize(j){
  if(!j||!Array.isArray(j.sections)) return null;
  j.info=j.info||{couple:'',date:'',location:''};
  j.sections.forEach(s=>{
    if(!s.id) s.id=uid();
    if(!Array.isArray(s.tasks)) s.tasks=[];
    if(!s.label) s.label='H-…';
    s.tasks.forEach(t=>{ if(!t.id) t.id=uid(); if(typeof t.done!=='boolean') t.done=false; });
  });
  return j;
}
function loadPlanLocal(){
  try{
    const j=JSON.parse(localStorage[PK]||'null');
    return normalize(j) || JSON.parse(JSON.stringify(PLAN_DEFAULT));
  }catch(e){ return JSON.parse(JSON.stringify(PLAN_DEFAULT)); }
}
async function loadPlanRemote(){
  const u=localStorage[K];
  if(!u) return null;
  try{
    const r=await fetch(u+'?type=plan&t='+Date.now());
    const txt=await r.text();
    if(!txt || !txt.trim() || txt.trim()==='{}' || txt.trim()==='null') return null;
    return normalize(JSON.parse(txt));
  }catch(e){ console.warn('Gagal load plan:',e); return null; }
}
async function initPlan(){
  const remote=await loadPlanRemote();
  if(remote) localStorage[PK]=JSON.stringify(remote);
  drawPage();
}
function savePlan(p){
  p=normalize(p)||p;
  localStorage[PK]=JSON.stringify(p);
  if(localStorage[K]) queue({action:'planSave', data:p});
  drawPage();
}

// ===== FORM MODAL (ganti prompt) =====
function formModal(title, fields, onSave){
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m) m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3>'+
    fields.map(f=>'<label>'+esc(f.label)+'</label><input id="fm_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.placeholder||'')+'">').join('')+
    '<div class="grid" style="margin-top:20px"><button data-act="form-cancel" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button data-act="form-save" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Simpan</button></div></div>';
  m._fields=fields;
  m._onSave=onSave;
  document.body.appendChild(m);
  setTimeout(()=>{ const inp=m.querySelector('input'); if(inp) inp.focus(); },100);
}
function confirmModal(title, message, onYes){
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m) m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3><p class="mute" style="margin:14px 0">'+esc(message)+'</p>'+
    '<div class="grid" style="margin-top:20px"><button data-act="cf-no" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button data-act="cf-yes" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Ya, lanjut</button></div></div>';
  m._onYes=onYes;
  document.body.appendChild(m);
}

// ===== AKSI =====
function openInfo(){
  const p=loadPlanLocal();
  formModal('Edit Info', [
    {key:'couple', label:'Nama pasangan', value:p.info.couple},
    {key:'date', label:'Tanggal (yyyy-mm-dd)', value:p.info.date, type:'date'},
    {key:'location', label:'Lokasi', value:p.info.location}
  ], vals=>{
    const p2=loadPlanLocal();
    p2.info={couple:vals.couple||p2.info.couple, date:vals.date||p2.info.date, location:vals.location||p2.info.location};
    savePlan(p2); toast('Info disimpan');
  });
}
function askReset(){
  confirmModal('Reset checklist?','Semua bagian dan tugas yang kamu buat akan dihapus, kembali ke contoh default.',()=>{
    localStorage.removeItem(PK);
    const def=JSON.parse(JSON.stringify(PLAN_DEFAULT));
    savePlan(def); toast('Checklist direset');
  });
}
function addSection(){
  formModal('Tambah bagian',[
    {key:'label', label:'Nama bagian', value:'H-1 bulan', placeholder:'Contoh: H-3 bulan, H-1 minggu, Hari-H'}
  ], vals=>{
    if(!vals.label){ toast('Isi nama bagian'); return; }
    const p=loadPlanLocal();
    p.sections.push({id:uid(), label:vals.label, tasks:[]});
    savePlan(p); toast('Bagian ditambahkan');
  });
}
function editSection(secId){
  const p=loadPlanLocal();
  const s=p.sections.find(x=>x.id===secId); if(!s)return;
  formModal('Edit nama bagian',[
    {key:'label', label:'Nama bagian', value:s.label}
  ], vals=>{
    if(!vals.label){ toast('Isi nama bagian'); return; }
    const p2=loadPlanLocal();
    const s2=p2.sections.find(x=>x.id===secId); if(!s2)return;
    s2.label=vals.label;
    savePlan(p2);
  });
}
function delSection(secId){
  const p=loadPlanLocal();
  const s=p.sections.find(x=>x.id===secId); if(!s)return;
  confirmModal('Hapus bagian?','Bagian "'+s.label+'" dan '+s.tasks.length+' tugas di dalamnya akan dihapus.',()=>{
    const p2=loadPlanLocal();
    p2.sections=p2.sections.filter(x=>x.id!==secId);
    savePlan(p2); toast('Bagian dihapus');
  });
}
function moveSection(secId,dir){
  const p=loadPlanLocal();
  const i=p.sections.findIndex(x=>x.id===secId); if(i<0)return;
  const j=i+dir; if(j<0||j>=p.sections.length)return;
  const a=p.sections.slice(); [a[i],a[j]]=[a[j],a[i]]; p.sections=a;
  savePlan(p);
}
function toggleTask(secId,taskId){
  const p=loadPlanLocal();
  const s=p.sections.find(x=>x.id===secId); if(!s)return;
  const t=s.tasks.find(x=>x.id===taskId); if(!t)return;
  t.done=!t.done; savePlan(p);
}
function delTask(secId,taskId){
  confirmModal('Hapus tugas?','Tugas ini akan dihapus dari daftar.',()=>{
    const p=loadPlanLocal();
    const s=p.sections.find(x=>x.id===secId); if(!s)return;
    s.tasks=s.tasks.filter(x=>x.id!==taskId);
    savePlan(p); toast('Tugas dihapus');
  });
}
function openTaskModal(secId,taskId){
  const p=loadPlanLocal();
  const sec=p.sections.find(s=>s.id===secId); if(!sec)return;
  const isNew=!taskId;
  const t=isNew ? {cat:'',title:''} : (sec.tasks.find(x=>x.id===taskId)||{cat:'',title:''});
  formModal((isNew?'Tambah tugas':'Edit tugas')+' — '+sec.label,[
    {key:'cat', label:'Kategori (opsional)', value:t.cat, placeholder:'Vendor, Undangan, Dokumen, …'},
    {key:'title', label:'Nama tugas', value:t.title, placeholder:'Contoh: Booking catering'}
  ], vals=>{
    if(!vals.title){ toast('Isi nama tugas'); return; }
    const p2=loadPlanLocal();
    const sec2=p2.sections.find(s=>s.id===secId); if(!sec2)return;
    if(taskId){
      const t2=sec2.tasks.find(x=>x.id===taskId);
      if(t2){ t2.cat=vals.cat; t2.title=vals.title; }
    } else {
      sec2.tasks.push({id:uid(), cat:vals.cat, title:vals.title, done:false});
    }
    savePlan(p2); toast('Tersimpan');
  });
}

// ===== GLOBAL CLICK (event delegation) =====
document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  if(act==='form-cancel'||act==='cf-no'){ const m=document.getElementById('md'); if(m) m.remove(); return; }
  if(act==='form-save'){
    const m=document.getElementById('md'); if(!m)return;
    const vals={};
    m._fields.forEach(f=>{ const el=document.getElementById('fm_'+f.key); vals[f.key]=el?el.value.trim():''; });
    m._onSave(vals); m.remove(); return;
  }
  if(act==='cf-yes'){
    const m=document.getElementById('md'); if(!m)return;
    const cb=m._onYes; m.remove(); if(cb) cb(); return;
  }
  const sec=b.dataset.sec, tsk=b.dataset.task;
  if(act==='section-add') return addSection();
  if(act==='section-up') return moveSection(sec,-1);
  if(act==='section-down') return moveSection(sec,1);
  if(act==='section-edit') return editSection(sec);
  if(act==='section-del') return delSection(sec);
  if(act==='task-toggle') return toggleTask(sec,tsk);
  if(act==='task-edit') return openTaskModal(sec,tsk);
  if(act==='task-del') return delTask(sec,tsk);
  if(act==='task-add') return openTaskModal(sec);
});

// Override tombol Sync
const _origSync=window.sync;
window.sync=async function(){
  await _origSync();
  const r=await loadPlanRemote();
  if(r){ localStorage[PK]=JSON.stringify(r); drawPage(); toast('Planning tersinkron'); }
};

window.drawPage=function(){
  const p=loadPlanLocal();
  document.getElementById('couple').textContent=p.info.couple||'';
  const fd=s=>s?new Date(s+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'long',year:'numeric'}):'-';
  document.getElementById('info').textContent=(p.info.date?fd(p.info.date):'')+(p.info.location?' · '+p.info.location:'');
  const all=p.sections.flatMap(s=>s.tasks);
  const done=all.filter(t=>t.done).length;
  const pct=all.length?done/all.length*100:0;
  let html='';
  html+='<div class="card"><div class="row"><b>Progres persiapan</b><span class="mute">'+done+'/'+all.length+'</span></div><div class="bar"><i style="width:'+pct+'%"></i></div><div class="mute">'+pct.toFixed(0)+'% selesai</div></div>';
  html+='<button data-act="section-add" style="padding:11px;border-radius:10px;font:600 14px Figtree,sans-serif;width:100%;border:1px dashed var(--wine);background:none;color:var(--wine);margin-bottom:12px">+ Tambah bagian (H-…)</button>';
  if(!p.sections.length) html+='<p class="mute" style="text-align:center">Belum ada bagian.</p>';
  p.sections.forEach((s,idx)=>{
    const sd=s.tasks.filter(t=>t.done).length;
    html+='<div class="plan-sec">';
    html+='<h3>'+esc(s.label)+' <span class="mute" style="font-size:12px;font-weight:400">· '+sd+'/'+s.tasks.length+'</span></h3>';
    html+='<div style="display:flex;gap:6px;justify-content:flex-end;margin:8px 0">';
    if(idx>0) html+='<button data-act="section-up" data-sec="'+s.id+'" style="padding:4px 10px;border:1px solid var(--line);background:none;border-radius:8px;font-size:13px">▲</button>';
    if(idx<p.sections.length-1) html+='<button data-act="section-down" data-sec="'+s.id+'" style="padding:4px 10px;border:1px solid var(--line);background:none;border-radius:8px;font-size:13px">▼</button>';
    html+='<button data-act="section-edit" data-sec="'+s.id+'" style="padding:4px 10px;border:1px solid var(--wine);background:none;color:var(--wine);border-radius:8px;font-size:13px">✏️ Nama</button>';
    html+='<button data-act="section-del" data-sec="'+s.id+'" style="padding:4px 10px;border:1px solid var(--line);background:none;color:#a33;border-radius:8px;font-size:13px">🗑️</button>';
    html+='</div>';
    if(!s.tasks.length) html+='<p class="mute" style="margin:6px 0">Belum ada tugas.</p>';
    s.tasks.forEach(t=>{
      html+='<div class="plan-task '+(t.done?'done':'')+'">'+
        '<input type="checkbox" '+(t.done?'checked':'')+' data-act="task-toggle" data-sec="'+s.id+'" data-task="'+t.id+'">'+
        '<div class="t">'+(t.cat?'<div class="cat">'+esc(t.cat)+'</div>':'')+'<span>'+esc(t.title)+'</span></div>'+
        '<button data-act="task-edit" data-sec="'+s.id+'" data-task="'+t.id+'" style="border:0;background:none;font-size:17px;padding:6px 4px">✏️</button>'+
        '<button data-act="task-del" data-sec="'+s.id+'" data-task="'+t.id+'" style="border:0;background:none;font-size:17px;padding:6px 4px;color:#a33">🗑️</button>'+
      '</div>';
    });
    html+='<button data-act="task-add" data-sec="'+s.id+'" style="margin-top:6px;padding:9px 12px;border:1px dashed var(--line);background:none;border-radius:8px;font:600 13px Figtree,sans-serif;color:var(--wine);width:100%">+ Tambah tugas</button>';
    html+='</div>';
  });
  html+='<div class="mute" style="text-align:center;margin-top:14px">Planning tersinkron ke Google Sheet.</div>';
  document.getElementById('m').innerHTML=html;
};

initPlan();
</script>
</body></html>
