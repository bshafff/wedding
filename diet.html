<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1d21"><link rel="manifest" href="manifest.json">
<title>Program Diet</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
<style>
button{cursor:pointer;touch-action:manipulation}
</style>
</head><body>
<header>
  <div class="hbtns">
    <button onclick="openTarget()">Target</button>
    <button onclick="openLog()">Catat</button>
    <button onclick="toast('Menyinkronkan...');sync()">Sync</button>
    <button onclick="manualUpdate()">🔄</button>
  </div>
  <h1>Program Diet</h1>
  <div class="couple" id="couple">—</div>
  <small id="sub"></small><small id="sy"></small>
  <div><span id="cn" class="badge"></span></div>
</header>
<div id="st"></div>
<main id="m"></main>
<nav></nav>
<script src="app.js"></script>
<script>
renderNav('diet');

const DK='sr_diet';
const DIET_DEFAULT={
  info:{
    couple:'Shaffan Burhan dan Annisa Istiqomah Sugandi',
    target:{calorie:1800,protein:120,water:2500,steps:8000,sleep:7},
    people:[
      {id:'p1',name:'Shaffan Burhan',height:0,startWeight:0,targetWeight:0},
      {id:'p2',name:'Annisa Istiqomah Sugandi',height:0,startWeight:0,targetWeight:0}
    ]
  },
  logs:[]
};

function uid(){return Math.random().toString(36).slice(2,9)}
function esc(s){return String(s==null?'':s).replace(/&/g,'&amp;').replace(/"/g,'&quot;').replace(/</g,'&lt;').replace(/>/g,'&gt;')}
function todayStr(){return new Date().toISOString().slice(0,10)}
function fd(s){if(!s)return '-';return new Date(s+'T00:00').toLocaleDateString('id-ID',{day:'numeric',month:'short',year:'numeric'})}

function normalize(j){
  if(!j||typeof j!=='object')return null;
  j.info=j.info||{};
  j.info.couple=j.info.couple||DIET_DEFAULT.info.couple;
  j.info.target=Object.assign({},DIET_DEFAULT.info.target,j.info.target||{});
  if(!Array.isArray(j.info.people)||!j.info.people.length){
    j.info.people=JSON.parse(JSON.stringify(DIET_DEFAULT.info.people));
  }
  j.info.people.forEach(x=>{
    if(!x.id)x.id=uid();
    if(!x.name)x.name='';
    x.height=+x.height||0;
    x.startWeight=+x.startWeight||0;
    x.targetWeight=+x.targetWeight||0;
  });
  if(!Array.isArray(j.logs))j.logs=[];
  j.logs.forEach(l=>{
    if(!l.id)l.id=uid();
    if(!l.personId)l.personId=j.info.people[0].id;
    if(!l.date)l.date=todayStr();
    l.weight=+l.weight||0;
    l.calories=+l.calories||0;
    l.protein=+l.protein||0;
    l.water=+l.water||0;
    l.steps=+l.steps||0;
    l.exercise=+l.exercise||0;
    l.sleep=+l.sleep||0;
    l.note=l.note||'';
  });
  return j;
}

function loadDietLocal(){
  try{
    const j=JSON.parse(localStorage[DK]||'null');
    return normalize(j)||JSON.parse(JSON.stringify(DIET_DEFAULT));
  }catch(e){
    return JSON.parse(JSON.stringify(DIET_DEFAULT));
  }
}
async function loadDietRemote(){
  const u=localStorage[K]; if(!u)return null;
  try{
    const r=await fetch(u+'?type=diet&t='+Date.now());
    const txt=await r.text();
    if(!txt||!txt.trim()||txt.trim()==='{}'||txt.trim()==='null')return null;
    return normalize(JSON.parse(txt));
  }catch(e){ return null; }
}
async function initDiet(){
  if(q_().some(x=>x.action==='dietSave')){ drawPage(); return; }
  const remote=await loadDietRemote();
  if(remote && !q_().some(x=>x.action==='dietSave')){
    localStorage[DK]=JSON.stringify(remote);
  }
  drawPage();
}
function saveDiet(p){
  p=normalize(p)||p;
  localStorage[DK]=JSON.stringify(p);
  if(localStorage[K])queue({action:'dietSave',data:p});
  drawPage();
}

function latestLog(pid,p){
  return p.logs.filter(l=>l.personId===pid).sort((a,b)=>(b.date||'').localeCompare(a.date||''))[0]||null;
}
function bmi(w,h){
  if(!w||!h)return '-';
  const m=h/100;
  return (w/(m*m)).toFixed(1);
}
function bmiCat(b){
  const n=parseFloat(b);
  if(isNaN(n))return '';
  if(n<18.5)return ' · kurang';
  if(n<25)return ' · normal';
  if(n<30)return ' · overweight';
  return ' · obesitas';
}
function metricBars(l,t){
  const rows=[
    ['Kalori',l.calories,t.calorie,'kkal'],
    ['Protein',l.protein,t.protein,'g'],
    ['Air',l.water,t.water,'ml'],
    ['Langkah',l.steps,t.steps,''],
    ['Tidur',l.sleep,t.sleep,'jam']
  ];
  return rows.map(r=>{
    const v=+r[1]||0, tg=+r[2]||1;
    const pc=Math.min(100,v/tg*100);
    return '<div style="margin-top:6px"><div class="row"><span class="mute">'+r[0]+'</span><span class="mute">'+v+' / '+tg+' '+r[3]+'</span></div><div class="bar"><i style="width:'+pc+'%"></i></div></div>';
  }).join('');
}

function formModal(title,fields,onSave){
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m)m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3>'+
    fields.map(f=>{
      if(f.type==='select'){
        return '<label>'+esc(f.label)+'</label><select id="fm_'+f.key+'" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;background:#fff">'+
          f.options.map(o=>'<option value="'+esc(o.value)+'" '+(String(o.value)===String(f.value)?'selected':'')+'>'+esc(o.label)+'</option>').join('')+
          '</select>';
      }
      if(f.type==='textarea'){
        return '<label>'+esc(f.label)+'</label><textarea id="fm_'+f.key+'" style="width:100%;padding:9px;border:1px solid var(--line);border-radius:8px;font:inherit;min-height:80px">'+esc(f.value||'')+'</textarea>';
      }
      return '<label>'+esc(f.label)+'</label><input id="fm_'+f.key+'" type="'+(f.type||'text')+'" value="'+esc(f.value||'')+'" placeholder="'+esc(f.placeholder||'')+'">';
    }).join('')+
    '<div class="grid" style="margin-top:20px"><button data-act="form-cancel" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button data-act="form-save" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Simpan</button></div></div>';
  m._fields=fields; m._onSave=onSave;
  document.body.appendChild(m);
  setTimeout(()=>{const i=m.querySelector('input,select');if(i)i.focus()},100);
}
function confirmModal(title,message,onYes){
  const m=document.createElement('div'); m.id='md';
  m.onclick=ev=>{ if(ev.target===m)m.remove(); };
  m.innerHTML='<div class="mc"><h3>'+esc(title)+'</h3><p class="mute" style="margin:14px 0">'+esc(message)+'</p>'+
    '<div class="grid" style="margin-top:20px"><button data-act="cf-no" style="padding:13px;border:0;border-radius:10px;background:#eee;color:var(--ink);font:600 15px Figtree,sans-serif">Batal</button><button data-act="cf-yes" style="padding:13px;border:0;border-radius:10px;background:var(--wine);color:#fff;font:600 15px Figtree,sans-serif">Ya, lanjut</button></div></div>';
  m._onYes=onYes;
  document.body.appendChild(m);
}

function openTarget(){
  const p=loadDietLocal(); const t=p.info.target;
  formModal('Target Harian',[
    {key:'calorie',label:'Kalori (kkal)',type:'number',value:t.calorie},
    {key:'protein',label:'Protein (g)',type:'number',value:t.protein},
    {key:'water',label:'Air (ml)',type:'number',value:t.water},
    {key:'steps',label:'Langkah',type:'number',value:t.steps},
    {key:'sleep',label:'Tidur (jam)',type:'number',value:t.sleep}
  ],vals=>{
    const p2=loadDietLocal();
    p2.info.target={
      calorie:+vals.calorie||1800,
      protein:+vals.protein||120,
      water:+vals.water||2500,
      steps:+vals.steps||8000,
      sleep:+vals.sleep||7
    };
    saveDiet(p2); toast('Target disimpan');
  });
}
function openProfile(pid){
  const p=loadDietLocal();
  const x=p.info.people.find(y=>y.id===pid); if(!x)return;
  formModal('Profil '+x.name,[
    {key:'name',label:'Nama',value:x.name},
    {key:'height',label:'Tinggi (cm)',type:'number',value:x.height||''},
    {key:'startWeight',label:'Berat awal (kg)',type:'number',value:x.startWeight||''},
    {key:'targetWeight',label:'Target berat (kg)',type:'number',value:x.targetWeight||''}
  ],vals=>{
    const p2=loadDietLocal();
    const x2=p2.info.people.find(y=>y.id===pid); if(!x2)return;
    x2.name=vals.name||x2.name;
    x2.height=+vals.height||0;
    x2.startWeight=+vals.startWeight||0;
    x2.targetWeight=+vals.targetWeight||0;
    saveDiet(p2); toast('Profil disimpan');
  });
}
function openLog(pid){
  const p=loadDietLocal();
  if(!p.info.people.length)return toast('Tambah profil dulu');
  const opts=p.info.people.map(x=>({value:x.id,label:x.name}));
  const defPid=pid||opts[0].value;
  const last=latestLog(defPid,p);
  formModal('Catat Harian',[
    {key:'personId',label:'Untuk',type:'select',options:opts,value:defPid},
    {key:'date',label:'Tanggal',type:'date',value:todayStr()},
    {key:'weight',label:'Berat (kg)',type:'number',value:last?last.weight:''},
    {key:'calories',label:'Kalori masuk (kkal)',type:'number',value:''},
    {key:'protein',label:'Protein (g)',type:'number',value:''},
    {key:'water',label:'Air (ml)',type:'number',value:''},
    {key:'steps',label:'Langkah',type:'number',value:''},
    {key:'exercise',label:'Olahraga (menit)',type:'number',value:''},
    {key:'sleep',label:'Tidur (jam)',type:'number',value:''},
    {key:'note',label:'Catatan',type:'text',value:''}
  ],vals=>{
    const p2=loadDietLocal();
    const pid2=vals.personId;
    const date=vals.date||todayStr();
    let log=p2.logs.find(l=>l.personId===pid2&&l.date===date);
    if(!log){ log={id:uid(),personId:pid2,date}; p2.logs.push(log); }
    Object.assign(log,{
      weight:+vals.weight||0,
      calories:+vals.calories||0,
      protein:+vals.protein||0,
      water:+vals.water||0,
      steps:+vals.steps||0,
      exercise:+vals.exercise||0,
      sleep:+vals.sleep||0,
      note:vals.note||''
    });
    saveDiet(p2); toast('Catatan disimpan');
  });
}
function delLog(id){
  confirmModal('Hapus catatan?','Catatan harian ini akan dihapus.',()=>{
    const p=loadDietLocal();
    p.logs=p.logs.filter(l=>l.id!==id);
    saveDiet(p); toast('Catatan dihapus');
  });
}

document.body.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]'); if(!b)return;
  const act=b.dataset.act;
  if(act==='form-cancel'||act==='cf-no'){ const m=document.getElementById('md'); if(m)m.remove(); return; }
  if(act==='form-save'){
    const m=document.getElementById('md'); if(!m)return;
    const vals={};
    m._fields.forEach(f=>{ const el=document.getElementById('fm_'+f.key); vals[f.key]=el?el.value.trim():''; });
    m._onSave(vals); m.remove(); return;
  }
  if(act==='cf-yes'){
    const m=document.getElementById('md'); if(!m)return;
    const cb=m._onYes; m.remove(); if(cb)cb(); return;
  }
  if(act==='target')return openTarget();
  if(act==='profile')return openProfile(b.dataset.id);
  if(act==='log')return openLog(b.dataset.id);
  if(act==='log-del')return delLog(b.dataset.id);
});

window.drawPage=function(){
  const p=loadDietLocal();
  const t=p.info.target;
  const today=todayStr();
  const todayLogs=p.logs.filter(l=>l.date===today);
  document.getElementById('couple').textContent=p.info.couple||'';
  document.getElementById('sub').textContent=todayLogs.length+' catatan hari ini · '+p.logs.length+' total';

  let html='';
  html+='<div class="card"><div class="row"><b>Target harian</b><button data-act="target" style="padding:4px 10px;border:1px solid var(--wine);background:none;color:var(--wine);border-radius:8px;font-size:12px">Edit</button></div>'+
    '<div class="grid" style="margin-top:8px">'+
    '<div class="mute">Kalori<br><b style="color:var(--wine)">'+t.calorie+' kkal</b></div>'+
    '<div class="mute">Protein<br><b style="color:var(--wine)">'+t.protein+' g</b></div>'+
    '<div class="mute">Air<br><b style="color:var(--wine)">'+t.water+' ml</b></div>'+
    '<div class="mute">Langkah<br><b style="color:var(--wine)">'+t.steps+'</b></div>'+
    '<div class="mute">Tidur<br><b style="color:var(--wine)">'+t.sleep+' jam</b></div>'+
    '</div></div>';

  p.info.people.forEach(x=>{
    const last=latestLog(x.id,p);
    const cur=last?last.weight:0;
    const start=x.startWeight||0, target=x.targetWeight||0;
    const delta=(cur&&start)?cur-start:0;
    const toTarget=(cur&&target)?cur-target:0;
    const prog=(start&&target&&cur)?Math.max(0,Math.min(100,Math.abs((start-cur)/(start-target||1))*100)):0;
    const logToday=todayLogs.find(l=>l.personId===x.id);

    html+='<div class="card">';
    html+='<div class="row"><b>'+esc(x.name)+'</b><button data-act="profile" data-id="'+x.id+'" style="padding:4px 10px;border:1px solid var(--wine);background:none;color:var(--wine);border-radius:8px;font-size:12px">Edit profil</button></div>';
    html+='<div class="grid" style="margin-top:8px">'+
      '<div><div class="mute">Berat sekarang</div><div class="num" style="font-size:20px;color:var(--wine)">'+(cur?cur+' kg':'-')+'</div></div>'+
      '<div><div class="mute">Target</div><div class="num" style="font-size:20px">'+(target?target+' kg':'-')+'</div></div>'+
      '</div>';
    html+='<div class="bar"><i style="width:'+prog+'%"></i></div>';
    const b=bmi(cur,x.height);
    html+='<div class="mute">'+prog.toFixed(0)+'% menuju target · BMI '+b+bmiCat(b)+'</div>';
    if(start||cur) html+='<div class="mute">Delta dari awal: '+(delta>0?'+':'')+delta.toFixed(1)+' kg · sisa ke target: '+toTarget.toFixed(1)+' kg</div>';
    html+='<div class="row" style="margin-top:10px"><button data-act="log" data-id="'+x.id+'" style="padding:10px;border:1px dashed var(--wine);background:none;color:var(--wine);border-radius:8px;font:600 13px Figtree,sans-serif;width:100%">+ Catat hari ini</button></div>';
    if(logToday){
      html+='<div class="realbox"><div class="sec">HARI INI</div>'+metricBars(logToday,t)+'</div>';
    } else {
      html+='<p class="mute" style="margin-top:10px">Belum ada catatan hari ini.</p>';
    }
    html+='</div>';
  });

  html+='<div class="card"><b>Riwayat terbaru</b>';
  const recent=p.logs.slice().sort((a,b)=>(b.date||'').localeCompare(a.date||'')).slice(0,20);
  if(!recent.length) html+='<p class="mute">Belum ada catatan.</p>';
  recent.forEach(l=>{
    const x=p.info.people.find(y=>y.id===l.personId);
    html+='<div class="row" style="border-top:1px solid var(--line);padding:8px 0">'+
      '<span><b>'+esc(x?x.name:'-')+'</b> <span class="mute">'+fd(l.date)+'</span><br>'+
      '<span class="mute">'+l.weight+' kg · '+l.calories+' kkal · protein '+l.protein+'g · air '+l.water+'ml · '+l.steps+' langkah · tidur '+l.sleep+'j</span></span>'+
      '<button data-act="log-del" data-id="'+l.id+'" style="border:0;background:none;color:#a33;font-size:17px">🗑️</button></div>';
  });
  html+='</div>';

  html+='<div class="card"><b>Panduan singkat</b>'+
    '<ul class="mute" style="margin:8px 0 0 18px;padding:0">'+
    '<li>Minum air 2–2.5 L/hari, bagi rata sepanjang hari.</li>'+
    '<li>Protein tiap makan: telur, ayam tanpa kulit, ikan, tempe, tahu, Greek yogurt.</li>'+
    '<li>Setengah piring sayur, seperempat protein, seperempat karbo kompleks.</li>'+
    '<li>Jalan cepat 30–45 menit atau 8.000 langkah/hari.</li>'+
    '<li>Tidur 7–8 jam; kurang tidur bikin lapar dan craving naik.</li>'+
    '<li>Batasi minuman manis, gorengan, dan camilan kemasan.</li>'+
    '</ul></div>';

  document.getElementById('m').innerHTML=html;
};

const _origSync=window.sync;
window.sync=async function(){
  await _origSync();
  if(q_().some(x=>x.action==='dietSave')){
    drawPage(); toast('Diet menunggu sinkron'); return;
  }
  const r=await loadDietRemote();
  if(r){ localStorage[DK]=JSON.stringify(r); drawPage(); toast('Diet tersinkron'); }
};

initDiet();
</script>
</body></html>
