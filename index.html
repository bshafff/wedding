<!doctype html><html lang="id"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#8f1d21"><link rel="manifest" href="manifest.json"><link rel="icon" href="icon.svg"><link rel="apple-touch-icon" href="apple-touch-icon.png"><meta name="apple-mobile-web-app-capable" content="yes"><meta name="mobile-web-app-capable" content="yes"><meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"><meta name="apple-mobile-web-app-title" content="Seserahan">
<title>Seserahan Tracker</title>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Figtree:wght@400;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css">
</head><body>
<header>
  <div class="hbtns"><button onclick="cfg()">Sheet</button><button onclick="toast('Menyinkronkan...');sync()">Sync</button><button onclick="manualUpdate()">🔄</button></div>
  <h1>Seserahan Tracker</h1>
  <div class="couple">Shaffan Burhan dan Annisa Istiqomah Sugandi</div>
  <small id="sub"></small><small id="sy"></small>
  <div><span id="cn" class="badge"></span></div>
</header>
<div id="st"></div>
<main id="m"></main>
<nav></nav>
<script src="app.js"></script>
<script>
renderNav('home');
window.drawPage=function(){
  const t=tot();
  $('#sub').textContent=t.dn+' dari '+t.n+' item sudah dibeli';
  if(!localStorage[K]&&!demo){ $('#m').innerHTML=welcomeHTML(); return; }
  $('#m').innerHTML=`
    <div class="grid" style="margin-bottom:12px">
      <div class="card"><div class="mute">Total realisasi</div><div class="num" style="font-size:20px;color:var(--wine)">${R(t.r)}</div></div>
      <div class="card"><div class="mute">Anggaran</div><div class="num" style="font-size:20px">${R(t.b)}</div></div>
    </div>
    <div class="card">
      <div class="row"><b>Progres</b><span class="mute">${t.pct.toFixed(0)}%</span></div>
      <div class="bar"><i style="width:${t.pct}%"></i></div>
      <div class="mute">${t.dn} dari ${t.n} item sudah dibeli</div>
    </div>
    <a class="menu-item" href="daftar.html">
      <div class="menu-icon" style="background:#fde8e4">📋</div>
      <div class="menu-text"><b>Daftar Seserahan</b><small>Kelola item, realisasi, edit & harga</small></div>
      <div class="menu-arrow">›</div>
    </a>
    <a class="menu-item" href="grafik.html">
      <div class="menu-icon" style="background:#f0e8f8">📊</div>
      <div class="menu-text"><b>Grafik & Analisa</b><small>Porsi anggaran, progres, tren realisasi</small></div>
      <div class="menu-arrow">›</div>
    </a>
    <a class="menu-item" href="planning.html">
      <div class="menu-icon" style="background:#e8f4ea">💍</div>
      <div class="menu-text"><b>Wedding Planning</b><small>Timeline & checklist persiapan</small></div>
      <div class="menu-arrow">›</div>
    </a>
    <div class="mute" style="text-align:center;margin-top:14px">Versi ${localStorage.app_v||'-'}</div>`;
};
</script>
</body></html>
